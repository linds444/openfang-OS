# OpenFang OS — Kernel Security Hardening
# Applied at boot via sysctl

# ─── Memory protection ────────────────────────────────────────────────────────
# Randomize virtual address space (ASLR)
kernel.randomize_va_space = 2

# Restrict mmap minimum address
vm.mmap_min_addr = 65536

# ─── Kernel pointer exposure ──────────────────────────────────────────────────
# Hide kernel pointers from non-root
kernel.kptr_restrict = 2

# Restrict dmesg to root
kernel.dmesg_restrict = 1

# ─── Kernel module protection ─────────────────────────────────────────────────
# Disable module loading after boot (if not needed)
# kernel.modules_disabled = 1  # Enable this after boot if no more modules needed

# ─── eBPF restrictions ────────────────────────────────────────────────────────
# Only root can use BPF
kernel.unprivileged_bpf_disabled = 1

# Disable JIT hardening bypass
net.core.bpf_jit_harden = 2

# ─── Ptrace restrictions ──────────────────────────────────────────────────────
# Only parent processes can ptrace (Yama LSM)
kernel.yama.ptrace_scope = 2

# ─── Network hardening ────────────────────────────────────────────────────────
# Disable IP forwarding (this is not a router)
net.ipv4.ip_forward = 0
net.ipv6.conf.all.forwarding = 0

# Enable TCP SYN cookies
net.ipv4.tcp_syncookies = 1

# Disable ICMP redirects
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0

# Ignore source-routed packets
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0

# Log martian packets
net.ipv4.conf.all.log_martians = 1
net.ipv4.conf.default.log_martians = 1

# Enable reverse path filter
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1

# Ignore ICMP broadcasts
net.ipv4.icmp_echo_ignore_broadcasts = 1

# Ignore bogus ICMP error responses
net.ipv4.icmp_ignore_bogus_error_responses = 1

# Protect against TCP timestamp attacks
net.ipv4.tcp_timestamps = 0

# ─── Process limits ───────────────────────────────────────────────────────────
# Limit core dumps (avoid sensitive data leaks)
kernel.core_pattern = |/bin/false
fs.suid_dumpable = 0

# ─── File system ──────────────────────────────────────────────────────────────
# Restrict hard links and symlinks
fs.protected_hardlinks = 1
fs.protected_symlinks = 1
fs.protected_fifos = 2
fs.protected_regular = 2

# ─── Performance tuning for AI workloads ─────────────────────────────────────
# Increase file descriptor limits
fs.file-max = 2097152

# Network buffer sizes
net.core.rmem_max = 134217728
net.core.wmem_max = 134217728
net.ipv4.tcp_rmem = 4096 87380 134217728
net.ipv4.tcp_wmem = 4096 65536 134217728

# Enable TCP BBR congestion control
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr

# ─── VM tuning ────────────────────────────────────────────────────────────────
vm.swappiness = 10
vm.dirty_ratio = 20
vm.dirty_background_ratio = 5
