[main]
plugins=ifupdown,keyfile

[ifupdown]
# Manage ALL interfaces via NetworkManager, including WiFi.
# Without this, NM defers to /etc/network/interfaces and WiFi
# shows as "unmanaged" in the tray applet.
managed=true

[device]
# Use NetworkManager's internal DHCP client (faster than dhclient)
wifi.backend=wpa_supplicant
