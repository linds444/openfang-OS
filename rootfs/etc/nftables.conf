#!/usr/sbin/nft -f
# OpenFang OS — Default Firewall Rules (nftables)
# Strategy: default deny, explicit allow

flush ruleset

table inet openfang_firewall {
    # ─── Sets ─────────────────────────────────────────────────────────────────
    set allowed_tcp_ports {
        type inet_service
        elements = {
            22,    # SSH
            8080,  # OpenFang API
        }
    }

    set blocked_countries {
        type ipv4_addr
        flags interval
        # Add known-malicious CIDR blocks here as needed
    }

    # ─── Input chain ──────────────────────────────────────────────────────────
    chain input {
        type filter hook input priority filter; policy drop;

        # Allow loopback
        iif lo accept

        # Allow established/related connections
        ct state established,related accept

        # Drop invalid packets
        ct state invalid drop

        # Allow ICMP (ping) — rate limited
        ip  protocol icmp   icmp  type { echo-request, echo-reply, destination-unreachable, time-exceeded } limit rate 10/second accept
        ip6 nexthdr icmpv6 icmpv6 type { echo-request, echo-reply, nd-neighbor-solicitation, nd-neighbor-advertisement, destination-unreachable, time-exceeded } accept

        # Allow configured TCP ports
        tcp dport @allowed_tcp_ports ct state new accept

        # Log and drop everything else
        log prefix "OPENFANG-DROP: " level warn flags all drop
    }

    # ─── Output chain ─────────────────────────────────────────────────────────
    chain output {
        type filter hook output priority filter; policy accept;

        # Allow all outbound (agents need to reach LLM APIs)
        # Tighten this if running in an isolated environment
    }

    # ─── Forward chain ────────────────────────────────────────────────────────
    chain forward {
        type filter hook forward priority filter; policy drop;
        # OpenFang OS is not a router
    }
}
